name: Feature request
description: Something binwave could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what is in the way now.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you would like binwave to behave. Settings, commands, examples.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now
      description: Workarounds you use or considered.
