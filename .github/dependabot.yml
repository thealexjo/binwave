version: 2
updates:
  # Minor and patch updates come in one pull request a week; a major update comes on its own.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A pseudo-version of the TiDB repository, which has no releases of the parser: updated by hand.
      - dependency-name: github.com/pingcap/tidb/pkg/parser
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  # The images of the Dockerfile are pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
