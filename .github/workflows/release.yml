name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time: an older one finishing after a newer one would move latest and 0.1 back.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The tagged commit must be on main and have passed the whole CI there, the run by hand with every
  # pair of versions; this is the last quick check.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the CI runs of the tagged commit
    outputs:
      newest: ${{ steps.order.outputs.newest }}
      newest-in-minor: ${{ steps.order.outputs.newest-in-minor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # main, to see that the tagged commit is on it
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not a commit of main"
            exit 1
          fi
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event workflow_dispatch --status success --json databaseId --jq length)
          if [ "$passed" -eq 0 ]; then
            echo "::error::the whole CI has not passed on $GITHUB_SHA: run it (gh workflow run ci.yml --ref main), wait for it to finish, then run this release again"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make lint test
      # Whether the tag is the highest stable version of all, and of its major.minor.
      - id: order
        run: |
          stable=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V)
          tag=$GITHUB_REF_NAME
          minor=${tag%.*}
          newest=false
          newest_in_minor=false
          if [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if [[ $(tail -n 1 <<<"$stable") == "$tag" ]]; then newest=true; fi
            if [[ $(grep -E "^${minor//./\\.}\.[0-9]+$" <<<"$stable" | tail -n 1) == "$tag" ]]; then newest_in_minor=true; fi
          fi
          echo "$tag: latest $newest, its major.minor $newest_in_minor"
          echo "newest=$newest" >> "$GITHUB_OUTPUT"
          echo "newest-in-minor=$newest_in_minor" >> "$GITHUB_OUTPUT"

  binaries:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release notes are made from the history since the previous tag
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The notes go back to the previous release, past its candidates; those of the first one to the start.
      - id: previous
        run: echo "ref=$(git describe --tags --abbrev=0 --exclude '*-*' HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }} # a commit may carry a release candidate's tag too
          GORELEASER_PREVIOUS_TAG: ${{ steps.previous.outputs.ref }}
          BINWAVE_MAKE_LATEST: ${{ needs.check.outputs.newest }}
      # GitHub keeps attestations only for a public repository of a user.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt # every archive and binary

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # the image in GHCR
      id-token: write # the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Every version gets its own tag; latest and 0.1 move only to the highest stable version (check).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.check.outputs.newest-in-minor }}
          flavor: latest=${{ needs.check.outputs.newest }}
      - id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # The labels come from the Dockerfile, with the version, commit and date of these arguments.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.commit.outputs.short }}
            DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
