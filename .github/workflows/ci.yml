name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make build
      - run: make verify-systemd
      - run: make cover
      - run: make fuzz FUZZTIME=10s

  docker:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make verify-docker

  integration:
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # MySQL: only the 8.4 LTS is verified for now, to keep CI fast. 8.0.36 and newer 8.0 releases
        # are accepted by the startup check but are not covered by the tests.
        mysql: ["mysql:8.4"]
        # ClickHouse: the flagship LTS releases.
        clickhouse: ["clickhouse/clickhouse-server:25.8", "clickhouse/clickhouse-server:26.8"]
    name: integration (${{ matrix.mysql }}, ${{ matrix.clickhouse }})
    env:
      BINWAVE_TEST_MYSQL_IMAGE: ${{ matrix.mysql }}
      BINWAVE_TEST_CLICKHOUSE_IMAGE: ${{ matrix.clickhouse }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test-integration
      - run: make test-e2e
