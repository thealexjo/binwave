name: CI

# A push or a pull request runs one pair of versions; the whole matrix and the fuzz tests run by hand
# (gh workflow run ci.yml), and a release needs that run on its commit.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!.github/ISSUE_TEMPLATE/**"
      - "docs/reference/**" # error-codes.md is checked by a test
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!.github/ISSUE_TEMPLATE/**"
      - "docs/reference/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make lint

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make vuln

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      - run: make verify-systemd
      - run: make cover
      - if: github.event_name == 'workflow_dispatch'
        run: make fuzz FUZZTIME=10s

  docker:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make verify-docker

  integration:
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # By hand: MySQL 8.4 with every ClickHouse LTS, the lowest supported 8.0 and Percona Server with
        # the newest. On a push: MySQL 8.4 with the newest.
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"mysql":"mysql:8.4","clickhouse":"clickhouse/clickhouse-server:25.8"},{"mysql":"mysql:8.4","clickhouse":"clickhouse/clickhouse-server:26.8"},{"mysql":"mysql:8.0.23","clickhouse":"clickhouse/clickhouse-server:26.8"},{"mysql":"percona:ps-8.0.28-20","clickhouse":"clickhouse/clickhouse-server:26.8"}]' || '[{"mysql":"mysql:8.4","clickhouse":"clickhouse/clickhouse-server:26.8"}]') }}
    name: integration (${{ matrix.mysql }}, ${{ matrix.clickhouse }})
    env:
      BINWAVE_TEST_MYSQL_IMAGE: ${{ matrix.mysql }}
      BINWAVE_TEST_CLICKHOUSE_IMAGE: ${{ matrix.clickhouse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-integration
      - run: make test-e2e
