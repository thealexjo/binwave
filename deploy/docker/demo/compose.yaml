# A local demo: MySQL, ClickHouse and binwave built from this repository. Not for production.
#   docker compose -f deploy/docker/demo/compose.yaml up -d --build
#   docker compose -f deploy/docker/demo/compose.yaml down -v

services:
  mysql:
    image: mysql:8.4
    command:
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-row-metadata=FULL
    environment:
      MYSQL_ROOT_PASSWORD: demo
    volumes:
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdemo"]
      interval: 2s
      retries: 60

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      CLICKHOUSE_DB: replica
      CLICKHOUSE_USER: binwave
      CLICKHOUSE_PASSWORD: demo
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "binwave", "--password", "demo", "-q", "SELECT 1"]
      interval: 2s
      retries: 60

  binwave:
    build: ../../..
    depends_on:
      mysql: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    volumes:
      - ./config.yaml:/etc/binwave/config.yaml:ro
    ports:
      - "127.0.0.1:9187:9187"
